name: MoroSystems QA Automation

# Run on changes to the main branch, pull requests and manual requests.
'on':
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# The workflow only needs to read the test repository.
permissions:
  contents: read

jobs:
  api-tests:
    name: API - Todo Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout test repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Validate TypeScript
        run: npx tsc --noEmit

      # The assignment requires running the official backend locally.
      - name: Clone Todo backend
        run: git clone https://github.com/morosystems/todo-be.git todo-be

      - name: Install backend dependencies
        working-directory: ./todo-be
        run: npm install

      - name: Start backend and check readiness
        run: |
          cd todo-be
          nohup npm start > ../todo-backend.log 2>&1 &
          cd ..

          for attempt in $(seq 1 20); do
            if curl --silent --fail --max-time 8 \
              http://localhost:8080/tasks > /dev/null; then
              echo 'Todo API is ready.'
              exit 0
            fi

            echo "Waiting for Todo API ($attempt/20)..."
            sleep 3
          done

          echo 'Todo API failed to start. Backend log:'
          cat todo-backend.log
          exit 1

      # Each API test creates unique task data and cleans it up afterwards.
      - name: Run API tests
        env:
          TODO_API_URL: http://localhost:8080
        run: npx playwright test --project=api --workers=2

      - name: Upload API HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload API diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: api-diagnostics
          path: |
            test-results/
            todo-backend.log
          retention-days: 14
          if-no-files-found: ignore

  gui-tests:
    name: GUI - Cross Browser
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout test repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Validate TypeScript
        run: npx tsc --noEmit

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      # Exclude Google (manual CAPTCHA) and visual snapshots (Windows baselines).
      # Functional Careers and responsive tests run across all three engines.
      # Visual regression is run locally on Windows, documented in README.
      - name: Run GUI functional and responsive tests
        run: |
          npx playwright test \
            --project=chromium \
            --project=firefox \
            --project=webkit \
            --grep-invert '@manual-captcha|@visual' \
            --workers=2

      - name: Upload GUI HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gui-playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload GUI diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gui-diagnostics
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
